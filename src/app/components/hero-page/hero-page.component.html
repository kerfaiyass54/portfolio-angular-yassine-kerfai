<section class="hero-section" id="hero">
  <div class="hero-meta"><span class="eyebrow"><i></i> {{ i18n.text('hero.category') }}</span><span class="hero-count">YK <span>—</span> 2026</span></div>
  <div class="hero-main">
    <div class="hero-copy">
      <p class="hero-role">{{ i18n.text('role') }} <span>·</span> {{ i18n.text('layout.portfolio') }}</p>
      <h1 class="hero-title" [attr.aria-label]="i18n.text('hero.title')"><span class="title-line">{{ i18n.text('hero.title') }}</span></h1>
      <p class="hero-description">{{ i18n.text('hero.description') }}</p>
      <div class="hero-actions"><a class="primary-action" href="#projects">{{ i18n.text('hero.primary') }} <i class="bi bi-arrow-down-right" aria-hidden="true"></i></a><a class="text-action" href="#links">{{ i18n.text('hero.secondary') }} <i class="bi bi-arrow-up-right" aria-hidden="true"></i></a></div>
    </div>
    <div class="hero-art" aria-hidden="true"><div class="art-disc"><span>YK</span><i class="disc-spark">✳</i></div><span class="art-caption" [innerHTML]="i18n.text('hero.art')"></span><span class="art-cross">+</span></div>
  </div>
  <a class="scroll-note" href="#details"><span>{{ i18n.text('hero.scroll') }}</span><i class="bi bi-arrow-down" aria-hidden="true"></i></a>
</section>
