<section class="hero-section" id="hero">
  <div class="hero-meta">
    <span class="eyebrow"><i></i> PERSONAL PORTFOLIO</span>
    <span class="hero-count">YK <span>—</span> 2026</span>
  </div>

  <div class="hero-main">
    <div class="hero-copy">
      <p class="hero-role">{{ role() }} <span>·</span> PORTFOLIO</p>
      <h1 class="hero-title" [attr.aria-label]="title() + ' ' + name()">
        <span class="title-line" aria-hidden="true"><span class="letter-run">@for (character of titleLetters(); track $index) {<span class="letter" [style.--letter-index]="$index">{{ character }}</span>}</span></span>
        <span class="title-line title-name" aria-hidden="true"><span class="letter-run">@for (character of nameLetters(); track $index) {<span class="letter" [style.--letter-index]="$index">{{ character }}</span>}</span></span>
      </h1>
      <p class="hero-description">{{ description() }}</p>
      <div class="hero-actions">
        <a class="primary-action" href="#projects">Explore projects <i class="bi bi-arrow-down-right" aria-hidden="true"></i></a>
        <a class="text-action" href="#links">Find my links <i class="bi bi-arrow-up-right" aria-hidden="true"></i></a>
      </div>
    </div>

    <div class="hero-art" aria-hidden="true">
      <div class="art-disc"><span>YK</span><i class="disc-spark">✳</i></div>
      <span class="art-caption">IDEAS INTO<br />INTERFACES</span>
      <span class="art-cross">+</span>
    </div>
  </div>

  <a class="scroll-note" href="#details"><span>SCROLL TO EXPLORE</span><i class="bi bi-arrow-down" aria-hidden="true"></i></a>
</section>
