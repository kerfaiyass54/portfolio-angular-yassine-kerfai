<section class="skills-section" aria-labelledby="skills-title">
  <header class="skills-heading">
    <div><span class="skills-kicker">{{ i18n.text('skills.kicker') }}</span><h2 id="skills-title">{{ i18n.text('skills.title') }}</h2></div>
    <p>{{ i18n.text('skills.description') }}</p>
  </header>

  <div class="skills-stepper-wrap">
    <div class="skills-stepper-note"><span><i class="bi bi-grid-3x3-gap" aria-hidden="true"></i> {{ i18n.text('skills.groups') }}</span><span>{{ i18n.text('skills.select') }}</span></div>
    <app-stepper [steps]="groups()" [showNavigationControls]="false" [large]="true" />
  </div>
</section>
