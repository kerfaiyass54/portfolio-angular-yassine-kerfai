name: Portfolio CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: '22'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build Angular application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -- --configuration production
      - name: Record result
        if: always()
        run: mkdir -p reports && printf 'Build: %s\n' "${{ job.status }}" > reports/build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-report
          path: reports/build.txt

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - name: Record result
        if: always()
        run: mkdir -p reports && printf 'Tests: %s\n' "${{ job.status }}" > reports/test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/test.txt

  quality:
    name: SonarQube code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Record result
        if: always()
        run: mkdir -p reports && printf 'SonarQube: %s\n' "${{ job.status }}" > reports/quality.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: reports/quality.txt

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record result
        if: always()
        run: mkdir -p reports && printf 'Docker image: %s\n' "${{ job.status }}" > reports/docker.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-report
          path: reports/docker.txt

  report:
    name: Create and email CI PDF report
    if: always()
    needs: [build, test, quality, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: '*-report'
          merge-multiple: true
      - name: Resolve author email
        id: author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.pull_request.user.login || github.event.sender.login || github.actor }}
        run: |
          email="$(gh api "users/${ACTOR}" --jq '.email // empty' 2>/dev/null || true)"
          if [ -z "$email" ]; then
            email="${{ secrets.CI_REPORT_EMAIL }}"
          fi
          if [ -z "$email" ]; then
            email="${ACTOR}@users.noreply.github.com"
          fi
          echo "email=$email" >> "$GITHUB_OUTPUT"
      - name: Generate PDF report
        run: |
          python -m pip install --quiet reportlab
          python - <<'PY'
          from pathlib import Path
          from reportlab.lib.pagesizes import A4
          from reportlab.pdfgen import canvas
          from reportlab.lib.units import mm
          files = sorted(Path("reports").glob("*.txt"))
          output = Path("ci-report.pdf")
          pdf = canvas.Canvas(str(output), pagesize=A4)
          width, height = A4
          y = height - 25 * mm
          pdf.setFont("Helvetica-Bold", 18)
          pdf.drawString(20 * mm, y, "Portfolio CI Report")
          y -= 12 * mm
          pdf.setFont("Helvetica", 10)
          pdf.drawString(20 * mm, y, "Repository: ${{ github.repository }}")
          y -= 6 * mm
          pdf.drawString(20 * mm, y, "Commit: ${{ github.sha }}")
          y -= 12 * mm
          for file in files:
              for line in file.read_text().splitlines():
                  pdf.drawString(25 * mm, y, line)
                  y -= 6 * mm
                  if y < 20 * mm:
                      pdf.showPage()
                      y = height - 20 * mm
                      pdf.setFont("Helvetica", 10)
          pdf.save()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ci-pdf-report
          path: ci-report.pdf
      - name: Email report to author
        env:
          SMTP_CONFIGURED: ${{ secrets.SMTP_HOST != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' }}
        if: env.SMTP_CONFIGURED == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: CI report - ${{ github.repository }} @ ${{ github.sha }}
          to: ${{ steps.author.outputs.email }}
          from: ${{ secrets.SMTP_FROM || secrets.SMTP_USERNAME }}
          body: The attached PDF contains the build, test, SonarQube, and Docker pipeline results.
          attachments: ci-report.pdf
